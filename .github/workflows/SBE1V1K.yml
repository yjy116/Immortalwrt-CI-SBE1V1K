name: Build SBE1V1K

on:
  workflow_dispatch:
    inputs:
      WIFI_MODE:
        description: '构建版本：both 同时构建 WiFi / 无 WiFi'
        type: choice
        options: [both, 'yes', 'no']
        default: both
      CONFIG_ONLY:
        description: '仅展开并验证配置，不编译固件'
        type: boolean
        default: false
      PUBLISH:
        description: '编译成功后发布 GitHub Release'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      wifi: ${{ steps.select.outputs.wifi }}
      build_attempt: ${{ steps.select.outputs.attempt }}
      source_commit: ${{ steps.source.outputs.commit }}
      package_snapshots: ${{ steps.source.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        env:
          WIFI_MODE: ${{ inputs.WIFI_MODE }}
        run: |
          case "$WIFI_MODE" in
            both) echo 'wifi=["yes","no"]' >> "$GITHUB_OUTPUT" ;;
            yes|no) printf 'wifi=["%s"]\n' "$WIFI_MODE" >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unsupported WIFI_MODE' >&2; exit 1 ;;
          esac
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Anchor release tags to this CI revision
        if: ${{ !inputs.CONFIG_ONLY && inputs.PUBLISH }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_COMMIT: ${{ github.sha }}
          WIFI_MODES: ${{ steps.select.outputs.wifi }}
        run: |
          for wifi in $(jq -r '.[]' <<< "$WIFI_MODES"); do
            python3 Scripts/release_tag.py --create \
              --tag "sbe1v1k-wifi-${wifi}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          done
      - name: Resolve latest upstream branch for this run
        id: source
        run: |
          commit=$(python3 Scripts/checkout_source.py --resolve-only)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          packages=$(python3 Scripts/resolve_packages.py --manifest Config/packages.json)
          printf 'packages=%s\n' "$packages" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        wifi: ${{ fromJSON(needs.matrix.outputs.wifi) }}
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      wifi: ${{ matrix.wifi }}
      config_only: ${{ inputs.CONFIG_ONLY }}
      source_snapshot: ${{ needs.matrix.outputs.source_commit }}
      package_snapshots: ${{ needs.matrix.outputs.package_snapshots }}
      build_attempt: ${{ needs.matrix.outputs.build_attempt }}

  release:
    if: ${{ !inputs.CONFIG_ONLY && inputs.PUBLISH }}
    needs: [matrix, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        wifi: ${{ fromJSON(needs.matrix.outputs.wifi) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbe1v1k-wifi-${{ matrix.wifi }}-${{ github.run_id }}-${{ needs.matrix.outputs.build_attempt }}
          path: artifacts
      - name: Publish verified firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WIFI: ${{ matrix.wifi }}
          CI_COMMIT: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ needs.matrix.outputs.build_attempt }}
        run: bash Scripts/publish_release.sh
