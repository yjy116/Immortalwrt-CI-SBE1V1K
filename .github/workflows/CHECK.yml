name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test configuration and packaging contracts
        run: timeout 60s python3 -m unittest discover -s Tests -v
      - name: Check shell syntax
        run: |
          for script in Scripts/*.sh Tests/*.sh files/etc/uci-defaults/*; do bash -n "$script"; done
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
